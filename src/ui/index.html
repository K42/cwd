<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kreator Postaci - Cień Władcy Demonów</title>
    <style>
        body {
            font-family: 'Georgia', serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #2c1810;
            color: #f4e4bc;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #8b0000;
            padding-bottom: 15px;
        }

        .section {
            background: #3a2318;
            border: 1px solid #8b0000;
            border-radius: 5px;
            padding: 20px;
            margin: 15px 0;
        }

        .form-group {
            margin: 15px 0;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #d4af37;
        }

        select, button, input {
            padding: 8px 12px;
            border: 2px solid #8b0000;
            border-radius: 3px;
            background: #2c1810;
            color: #f4e4bc;
            font-size: 16px;
        }

        button {
            background: #8b0000;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #a50000;
        }

        .character-sheet {
            display: none;
            background: #1a1a1a;
            border: 3px solid #d4af37;
            padding: 20px;
            margin-top: 20px;
        }

        .attributes-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin: 15px 0;
        }

        .attribute-box {
            background: #2c1810;
            border: 1px solid #8b0000;
            padding: 10px;
            text-align: center;
            border-radius: 3px;
        }

        .error {
            color: #ff6b6b;
            background: #3d1a1a;
            border: 1px solid #8b0000;
            padding: 10px;
            border-radius: 3px;
            margin: 10px 0;
        }

        .loading {
            text-align: center;
            font-style: italic;
            color: #d4af37;
        }

        .tiles-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
            margin-top: 10px;
        }

        .origin-tile {
            background: #3a2318;
            border: 2px solid #8b0000;
            border-radius: 8px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .origin-tile:hover {
            border-color: #d4af37;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
        }

        .origin-tile.selected {
            border-color: #d4af37;
            background: #4a2d20;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
        }

        .origin-tile h4 {
            margin: 0 0 8px 0;
            color: #d4af37;
            font-size: 18px;
        }

        .origin-tile .description {
            font-size: 14px;
            line-height: 1.4;
            margin-bottom: 10px;
            color: #f4e4bc;
        }

        .origin-tile .stats {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #b8860b;
            margin-top: 8px;
        }

        .origin-tile .stat {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .origin-tile .stat-value {
            font-weight: bold;
            color: #d4af37;
        }

        .origin-tile .size-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #8b0000;
            color: white;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>⚔️ Kreator Postaci</h1>
        <h2>Cień Władcy Demonów</h2>
        <p><em>Stwórz swojego bohatera dla świata mroku i magii</em></p>
    </div>

    <div class="section">
        <h3>🎭 Tworzenie Postaci</h3>

        <div class="form-group">
            <label>Pochodzenie:</label>
            <div id="pochodzenie-tiles" class="tiles-container">
                <!-- Kafelki będą generowane przez JavaScript -->
            </div>
        </div>

        <div class="form-group">
            <label for="sciezka">Ścieżka Nowicjusza (opcjonalnie):</label>
            <select id="sciezka">
                <option value="">Brak ścieżki</option>
            </select>
        </div>

        <div class="form-group">
            <label>
                <input type="checkbox" id="losowe-atrybuty" checked>
                Użyj losowych atrybutów (3k6 każdy)
            </label>
        </div>

        <div id="custom-attributes" style="display: none;">
            <h4>Własne wartości atrybutów:</h4>
            <div class="attributes-grid">
                <div>
                    <label for="sila">Siła:</label>
                    <input type="number" id="sila" min="3" max="18" value="10">
                </div>
                <div>
                    <label for="zrecznosc">Zręczność:</label>
                    <input type="number" id="zrecznosc" min="3" max="18" value="10">
                </div>
                <div>
                    <label for="intelekt">Intelekt:</label>
                    <input type="number" id="intelekt" min="3" max="18" value="10">
                </div>
                <div>
                    <label for="wola">Wola:</label>
                    <input type="number" id="wola" min="3" max="18" value="10">
                </div>
            </div>
        </div>

        <button onclick="utworzPostac()" id="btn-utworz">🎲 Utwórz Postać</button>
        <div id="loading" class="loading" style="display: none;">
            Tworzenie postaci...
        </div>
        <div id="error" class="error" style="display: none;"></div>
    </div>

    <div id="character-sheet" class="character-sheet">
        <h3>📜 Karta Postaci</h3>
        <div id="character-content"></div>
        <button onclick="exportJSON()" style="margin-top: 15px;">💾 Eksportuj JSON</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
